# =========================================================
#  KnetRaid 시즌 및 랭킹 시스템 설정 파일
#  이 단계(시즌 및 랭킹 시스템)부터 실제로 사용됩니다.
# =========================================================

season:
  enabled: true
  # 0 이하로 설정하면 자동 종료하지 않고 관리자가 직접 /약탈관리 시즌 종료로 끝내야 합니다.
  duration-days: 30
  reset:
    require-confirmation: true
  # 시즌 종료 시 처치 랭킹 1~3위에게 지급할 보너스 금액 (Vault 필요, 0이면 미지급)
  rewards:
    top-kills-bonus: [10000, 5000, 3000]
