# =========================================================
#  KnetRaid 랜덤 텔레포트(야생) 시스템 설정 파일
#  이 단계(랜덤 텔레포트)부터 실제로 사용됩니다.
# =========================================================

teleport:
  enabled: true
  # 월드 스폰(또는 0,0) 기준 이동 가능한 최소/최대 거리(블록)
  min-radius: 100
  max-radius: 5000
  # 안전한 위치를 찾기 위해 시도할 최대 횟수. 초과하면 이동을 취소한다.
  max-attempts: 20
  cooldown-seconds: 60
  # 0이면 무료
  cost: 0
  # 이동 전 대기 시간(초). 0이면 즉시 이동한다.
  warmup-seconds: 3
  # 대기 중 피격 시 이동을 취소할지 여부
  cancel-on-damage: true
  worlds:
    world: true
